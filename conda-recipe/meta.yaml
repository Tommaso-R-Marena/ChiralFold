{% set name = "chiralfold" %}
{% set version = "3.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - chiralfold = chiralfold.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=65
    - wheel
  run:
    - python >=3.9
    - numpy >=1.21,<3.0
    - scipy >=1.9,<2.0
    - pandas >=1.3,<3.0
    - matplotlib-base >=3.5,<4.0
    - seaborn >=0.11,<1.0
    - scikit-learn >=1.0,<2.0
    - rdkit >=2023.03,<2027

test:
  imports:
    - chiralfold
    - chiralfold.viz
  commands:
    - chiralfold --version

about:
  home: https://github.com/Tommaso-R-Marena/ChiralFold
  license: MIT
  license_file: LICENSE
  summary: Chirality-correct protein stereochemistry toolkit
  description: |
    ChiralFold provides PDB stereochemistry auditing, D-peptide construction,
    AF3 chirality correction, and mirror-image peptide design utilities.

extra:
  recipe-maintainers:
    - Tommaso-R-Marena
