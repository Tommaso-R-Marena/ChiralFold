name: chiralfold-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=1.21
  - scipy>=1.9
  - pandas>=1.3
  - matplotlib>=3.5
  - seaborn>=0.11
  - scikit-learn>=1.0
  - rdkit>=2023.03
