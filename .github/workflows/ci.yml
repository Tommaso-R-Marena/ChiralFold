name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev,web]"

      - name: Run Ruff
        run: |
          ruff check chiralfold/ web/

      # NOTE: `-m "not slow"` excludes tests marked @pytest.mark.slow, which
      # cover network-dependent benchmarks (RCSB structure downloads, wwPDB
      # validation XML fetches for the MolProbity comparison) and long-running
      # compute (the >=100-structure Ramachandran benchmark and full Childs et al.
      # 2025 enumeration). These are designed to be run manually or in scheduled
      # benchmark workflows, not on every PR/push.
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short -m "not slow" --cov=chiralfold --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install web extras
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev,web]"

      - name: Web UI unit + integration tests
        run: |
          pytest tests/test_web_app.py tests/test_web_integration.py tests/test_web_packaging.py -v --tb=short -m "not slow"

      - name: Import and build Gradio app
        run: |
          python -c "from web.app import build_app; d=build_app(); print('OK', type(d))"

  docker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI Docker image
        run: docker build -t chiralfold:ci .

      - name: CLI help via container
        run: docker run --rm chiralfold:ci --help

      - name: Build Web Docker image
        run: docker build -f Dockerfile.web -t chiralfold-web:ci .

      - name: Web module present in web image
        run: |
          docker run --rm --entrypoint python chiralfold-web:ci -c "import web.app; print('web ok')"
