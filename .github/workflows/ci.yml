name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ------------------------------------------------------------------
  # Linux matrix (full coverage + ruff)
  # ------------------------------------------------------------------
  test-linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev,web]"

      - name: Run Ruff
        run: ruff check chiralfold/ web/

      # NOTE: `-m "not slow"` excludes network / long-running benchmarks.
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short -m "not slow" --cov=chiralfold --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: Offline survey reproduce script
        run: python benchmarks/reproduce_d_residue_errors.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # macOS
  # ------------------------------------------------------------------
  test-macos:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3"
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --tb=short -m "not slow"

      - name: Offline survey reproduce script
        run: python benchmarks/reproduce_d_residue_errors.py

      - name: Import package smoke
        run: python -c "import chiralfold; from chiralfold import audit_pdb, mirror_pdb; print(chiralfold.__version__)"

  # ------------------------------------------------------------------
  # Windows
  # ------------------------------------------------------------------
  test-windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3"
          pip install -e ".[dev]"

      - name: Run tests
        shell: bash
        run: pytest tests/ -q --tb=short -m "not slow"

      - name: Offline survey reproduce script
        shell: bash
        run: python benchmarks/reproduce_d_residue_errors.py

      - name: Import package smoke
        shell: bash
        run: python -c "import chiralfold; from chiralfold import audit_pdb, mirror_pdb; print(chiralfold.__version__)"

  # ------------------------------------------------------------------
  # Web UI smoke (Linux + Gradio)
  # ------------------------------------------------------------------
  web-smoke:
    name: Web UI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install web extras
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev,web]"

      - name: Web UI unit + integration tests
        run: |
          pytest tests/test_web_app.py tests/test_web_integration.py tests/test_web_packaging.py tests/test_web_edge_cases.py tests/test_web_e2e.py -v --tb=short -m "not slow"

      - name: Import and build Gradio app
        run: |
          python -c "from web.app import build_app; d=build_app(); print('OK', type(d))"

      - name: Example PDBs bundled in package data
        run: |
          python -c "from pathlib import Path; import chiralfold; root=Path(chiralfold.__file__).parent; assert (root/'data/examples/toy_ubiquitin_fragment.pdb').is_file(); assert (root/'data/examples/synthetic_l_ala_inverted.pdb').is_file(); print('examples ok')"

  # ------------------------------------------------------------------
  # Docker CLI + Web images
  # ------------------------------------------------------------------
  docker-web:
    name: Docker CLI + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI Docker image
        run: docker build -t chiralfold:ci .

      - name: CLI help via container
        run: docker run --rm chiralfold:ci --help

      - name: Build Web Docker image
        run: docker build -f Dockerfile.web -t chiralfold-web:ci .

      - name: Web module present in web image
        run: |
          docker run --rm --entrypoint python chiralfold-web:ci -c "import web.app; from pathlib import Path; import chiralfold; p=Path(chiralfold.__file__).parent/'data/examples/synthetic_l_ala_inverted.pdb'; assert p.is_file(), p; print('web ok', p)"

  # ------------------------------------------------------------------
  # Bioinformatics manuscript — catch body text spilling off the page
  # ------------------------------------------------------------------
  latex-overflow:
    name: LaTeX overflow check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live (minimal)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-science

      - name: Check Bioinformatics manuscript overflow
        run: ./paper/submission/bioinformatics/check_latex_overflow.sh

  # ------------------------------------------------------------------
  # Hugging Face Space — Docker build + runtime smoke (parity with live Space)
  # ------------------------------------------------------------------
  hf-space-docker:
    name: HF Space Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build HF Space Docker image
        run: docker build -f hf_space/Dockerfile -t chiralfold-hf:ci hf_space

      - name: Import smoke inside container
        run: |
          docker run --rm chiralfold-hf:ci python -c "
          import app
          from chiralfold.af3_correct import detect_chirality_violations
          toy = 'examples/toy_ubiquitin_fragment.pdb'
          inv = 'examples/synthetic_l_ala_inverted.pdb'
          assert detect_chirality_violations(toy)['n_violations'] == 0
          assert detect_chirality_violations(inv)['n_violations'] >= 1
          md, j = app.run_audit(toy)
          assert 'Stereochemistry audit' in md and j
          md2, p = app.run_correct(inv)
          assert detect_chirality_violations(p)['n_violations'] == 0
          d = app.build_app()
          assert hasattr(d, 'launch')
          print('HF Space Docker smoke OK')
          "
