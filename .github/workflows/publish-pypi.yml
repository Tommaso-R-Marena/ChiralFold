# Publish to PyPI (Trusted Publishing / OIDC, with API-token fallback)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v3.5.1)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty password → Trusted Publisher (OIDC).
          # Set repo secret PYPI_API_TOKEN to a PyPI API token as a fallback when
          # Trusted Publisher is not yet linked (see docs/PYPI_PUBLISHING.md).
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
