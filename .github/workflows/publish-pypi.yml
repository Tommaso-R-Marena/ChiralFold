name: Publish to PyPI

# Publish to PyPI (Trusted Publishing / OIDC, with API-token fallback).
# Runs only on the canonical upstream repo — forks lack the PyPI Trusted
# Publisher + GitHub Environment configuration and must not fail here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v3.6.0)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publisher OIDC is registered for Tommaso-R-Marena/ChiralFold only.
    if: github.repository == 'Tommaso-R-Marena/ChiralFold'
    # Must match the Environment name configured on the PyPI Trusted Publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/chiralfold/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -la dist/

      - name: Preflight — Trusted Publisher checklist
        env:
          HAS_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
        run: |
          echo "Publishing chiralfold from Tommaso-R-Marena/ChiralFold"
          echo "Workflow file: publish-pypi.yml"
          echo "GitHub Environment: pypi"
          echo "API token secret set: ${HAS_API_TOKEN}"
          if [ "${HAS_API_TOKEN}" != "true" ]; then
            cat <<'EOF'
          Using Trusted Publishing (OIDC). PyPI must have a matching publisher:

            PyPI project name : chiralfold
            Owner             : Tommaso-R-Marena
            Repository        : ChiralFold
            Workflow name     : publish-pypi.yml
            Environment name  : pypi

          For a brand-new project, add a *pending* publisher under your PyPI
          account Publishing settings, then re-run this workflow.
          Docs: docs/PYPI_PUBLISHING.md
          EOF
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty / unset PYPI_API_TOKEN → OIDC Trusted Publisher.
          # Set repo secret PYPI_API_TOKEN (pypi-...) as a fallback.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
          # Attestations need extra setup; keep off until Trusted Publisher works.
          attestations: false

  publish-skipped-fork:
    runs-on: ubuntu-latest
    if: github.repository != 'Tommaso-R-Marena/ChiralFold'
    steps:
      - name: Skip PyPI publish on fork
        run: |
          echo "Skipping PyPI publish: this workflow is restricted to the upstream"
          echo "repository Tommaso-R-Marena/ChiralFold (Trusted Publisher / OIDC)."
          echo "Current repository: ${GITHUB_REPOSITORY}"
          echo "Forks and reviewer copies should not publish to PyPI."
