name: Deploy Hugging Face Space

# Build + smoke-test the Space Docker image on every qualifying push/PR path;
# upload to Hugging Face only from the canonical upstream repo when HF_TOKEN is set.

on:
  push:
    branches: [master, main]
    paths:
      - "hf_space/**"
      - "web/**"
      - "chiralfold/**"
      - ".github/workflows/deploy-hf-space.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "hf_space/**"
      - "web/**"
      - "chiralfold/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HF Space build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install package + web extras (parity with Space requirements)
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev,web]"

      - name: HF Space unit + e2e tests
        run: |
          pytest tests/test_web_e2e.py::test_hf_space_theme_css_bundled_and_synced \
                 tests/test_web_e2e.py::test_hf_space_dockerfile_copies_theme \
                 tests/test_web_e2e.py::test_hf_space_app_syntax_and_theme_loader \
                 tests/test_web_e2e.py::test_e2e_all_hf_space_functions -v --tb=short

      - name: Build HF Space Docker image
        run: docker build -f hf_space/Dockerfile -t chiralfold-hf:ci hf_space

      - name: Docker runtime smoke
        run: |
          docker run --rm chiralfold-hf:ci python -c "
          import app
          from chiralfold.af3_correct import detect_chirality_violations
          toy = 'examples/toy_ubiquitin_fragment.pdb'
          inv = 'examples/synthetic_l_ala_inverted.pdb'
          assert detect_chirality_violations(inv)['n_violations'] >= 1
          _, corr = app.run_correct(inv)
          assert detect_chirality_violations(corr)['n_violations'] == 0
          app.build_app()
          print('docker smoke OK')
          "

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'Tommaso-R-Marena/ChiralFold' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24"

      - name: Sync hf_space/ → Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret not set — skipping Space deploy."
            echo "Add a write token at Settings → Secrets → HF_TOKEN"
            exit 0
          fi
          python <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "The-Philosopher/ChiralFold-App"
          api = HfApi(token=token)
          who = api.whoami()
          print(f"Authenticated as: {who.get('name')}")
          api.upload_folder(
              folder_path=str(Path("hf_space").resolve()),
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy ChiralFold web Space from CI",
              ignore_patterns=["__pycache__", "*.pyc", ".git*"],
          )
          print(f"Deployed https://huggingface.co/spaces/{repo_id}")
          PY

  deploy-skipped-fork:
    name: Skip HF deploy on fork
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.repository != 'Tommaso-R-Marena/ChiralFold' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Skip deploy
        run: |
          echo "HF Space deploy skipped on fork: ${GITHUB_REPOSITORY}"
          echo "Tests passed; only Tommaso-R-Marena/ChiralFold pushes to The-Philosopher/ChiralFold-App."
