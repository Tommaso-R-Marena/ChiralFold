name: Nightly benchmarks

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  experimental-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit>=2023.3" || pip install rdkit-pypi
          pip install -e ".[dev]"

      - name: Experimental structure validation
        run: python benchmarks/experimental_structure_validation.py

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: experimental-validation
          path: |
            results/experimental_validation_report.json
            results/experimental_validation_summary.csv
          if-no-files-found: warn
