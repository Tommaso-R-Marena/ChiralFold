[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chiralfold"
version = "3.6.0"
description = "Chirality-correct protein stereochemistry toolkit: PDB auditing, D-peptide construction, AF3 correction, and mirror-image design"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Tommaso R. Marena", email = "marena@cua.edu"},
]
keywords = ["chirality", "peptide", "D-amino-acid", "diastereomer", "structure-prediction", "alphafold", "PDB", "stereochemistry", "MolProbity"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.21,<3.0",
    "rdkit>=2023.3,<2027",
    "scipy>=1.9,<2.0",
    "pandas>=1.3,<3.0",
]

[project.optional-dependencies]
web = [
    "gradio>=4.44,<6",
    # Gradio 4.x still imports HfFolder; pin until Gradio 5+ is default
    "huggingface_hub>=0.23,<1.0",
]
viz = [
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.11,<1.0",
    "scikit-learn>=1.0,<2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pre-commit",
    "ruff",
    "mypy",
    "matplotlib>=3.5,<4.0",
    "seaborn>=0.11,<1.0",
    "scikit-learn>=1.0,<2.0",
]

[project.scripts]
chiralfold = "chiralfold.cli:main"
chiralfold-web = "web.app:main"

[project.urls]
Homepage = "https://github.com/Tommaso-R-Marena/ChiralFold"
Repository = "https://github.com/Tommaso-R-Marena/ChiralFold"
Issues = "https://github.com/Tommaso-R-Marena/ChiralFold/issues"
Documentation = "https://github.com/Tommaso-R-Marena/ChiralFold/blob/master/README.md"

[tool.setuptools.packages.find]
include = ["chiralfold*", "web*"]

[tool.setuptools.package-data]
chiralfold = ["data/*.json", "data/*.py", "data/*.pdb", "data/examples/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow to run (requires network or long compute)",
]

[tool.coverage.run]
source = ["chiralfold", "web"]
omit = ["tests/*", "benchmarks/*", "paper/*", "hf_space/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection is not stable across
# releases — 0.16 turned on UP/I/S/C4/SIM and others by default, which made
# `ruff check chiralfold/ web/` fail on every branch with ~500 findings that no
# code change had introduced. Several of those rules are also inapplicable here:
# the package supports Python 3.9, so UP006/UP035/UP045 (PEP 585/604 generics)
# would break the published minimum version.
#
# This is the set the codebase is written against and passes cleanly:
#   E4 imports, E7 statements, E9 runtime errors, F pyflakes.
select = ["E4", "E7", "E9", "F"]
